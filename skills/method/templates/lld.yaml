component: <name>
version: "1.0"
status: Draft
trace-id: TR-<scope>-NNN
owner-team: <team>

purpose: >
  <what this component is responsible for, in business terms>

responsibilities:
  - id: R1
    description: <...>
    satisfies-drivers: [QA-...]

non-responsibilities:
  - <what it deliberately does not do, and who does>

interfaces:
  provides:
    - name: <operation>
      kind: sync-api | async-event | scheduled | cli
      spec: 06-interfaces/<component>-api.yaml#/paths/...
      implements: R1
      consumers: [<component or client>]
  consumes:
    - name: <upstream operation/event>
      from: <component>
      reason: <why>
      failure-behaviour: fail-fast | retry | fallback | degrade | queue
      timeout: <value>
      idempotent: true | false

data:
  owns:
    - entity: <Name>
      store: <logical store>
      retention: <period + trigger>
      sensitivity: public | internal | confidential | restricted
  references:
    - entity: <Name>
      source: <owning component>
      freshness: <staleness tolerance>

state-machines:
  - entity: <Name>
    states: []
    transitions:
      - from: <s1>
        to: <s2>
        trigger: <...>
        guard: <...>

internal-structure:
  - element: <module>
    responsibility: <...>

concurrency:
  model: <...>
  shared-state: <...>
  ordering-guarantees: <...>
  idempotency: <...>

configuration:
  - key: <name>
    purpose: <...>
    default: <...>
    secret: false

failure-modes:
  - mode: <...>
    detection: <...>
    handling: <...>
    user-visible-effect: <...>

constraints:
  - <...>

open-items:
  - item: <...>
    owner: <...>
    by: <date>

changelog:
  - version: "1.0"
    date: <YYYY-MM-DD>
    author: <name>
    changes: Initial
