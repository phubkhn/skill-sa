openapi: 3.1.0
info:
  title: Order Intake API
  version: 1.0.0
  description: Accept orders, expose their status, and receive fulfilment state updates.
servers:
  - url: https://api.example.com
paths:
  /orders:
    post:
      operationId: submitOrder
      summary: Durably accept an order
      security:
        - oidc: [orders:submit]
      parameters:
        - name: Idempotency-Key
          in: header
          required: true
          schema: {type: string, format: uuid}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OrderSubmission'
            example: {customerId: c-17, items: [{sku: SKU-1, quantity: 2}]}
      responses:
        '202':
          description: Order is durably accepted, not necessarily fulfilled
          headers:
            Location:
              schema: {type: string}
              example: /orders/01J8Z6Y2W7M5P8K3Q9F4N1T0AB
          content:
            application/json:
              schema: {$ref: '#/components/schemas/OrderStatus'}
              example: {orderId: 01J8Z6Y2W7M5P8K3Q9F4N1T0AB, status: accepted}
        '400': {$ref: '#/components/responses/Error'}
        '401': {$ref: '#/components/responses/Error'}
        '503': {$ref: '#/components/responses/Error'}
  /orders/{orderId}:
    get:
      operationId: getOrderStatus
      security:
        - oidc: [orders:read]
      parameters:
        - name: orderId
          in: path
          required: true
          schema: {type: string}
      responses:
        '200':
          description: Current order status
          content:
            application/json:
              schema: {$ref: '#/components/schemas/OrderStatus'}
              example: {orderId: 01J8Z6Y2W7M5P8K3Q9F4N1T0AB, status: processing}
        '404': {$ref: '#/components/responses/Error'}
  /internal/orders/{orderId}/state:
    put:
      operationId: updateOrderState
      summary: Idempotently apply a fulfilment state
      security:
        - oidc: [orders:state-write]
      parameters:
        - name: orderId
          in: path
          required: true
          schema: {type: string}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [eventId, status]
              properties:
                eventId: {type: string, format: uuid}
                status: {type: string, enum: [processing, fulfilled, rejected]}
            example: {eventId: 2fe6d30b-2f0e-4905-a95e-34bb70502dd1, status: fulfilled}
      responses:
        '204': {description: State applied or already applied}
        '409': {$ref: '#/components/responses/Error'}
components:
  securitySchemes:
    oidc:
      type: openIdConnect
      openIdConnectUrl: https://identity.example.com/.well-known/openid-configuration
  schemas:
    OrderSubmission:
      type: object
      required: [customerId, items]
      properties:
        customerId: {type: string}
        items:
          type: array
          minItems: 1
          maxItems: 100
          items:
            type: object
            required: [sku, quantity]
            properties:
              sku: {type: string}
              quantity: {type: integer, minimum: 1}
    OrderStatus:
      type: object
      required: [orderId, status]
      properties:
        orderId: {type: string}
        status: {type: string, enum: [accepted, processing, fulfilled, rejected]}
    Error:
      type: object
      required: [code, message, traceId]
      properties:
        code: {type: string}
        message: {type: string}
        traceId: {type: string}
  responses:
    Error:
      description: Request failed
      content:
        application/json:
          schema: {$ref: '#/components/schemas/Error'}
          example: {code: unavailable, message: Try again later, traceId: 3b29c27f}
